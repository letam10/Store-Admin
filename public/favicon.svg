<!--
  FILE NOTE
  - Mục đích: Favicon vector SVG nhận diện thương hiệu Store-Admin đồng bộ với OmniCart - squircle xanh thực vật, chữ 'o' và hạt mầm mint hiện đại.
  - Liên kết trực tiếp: Store-Admin/index.html, Store-Admin/src/pages/Admin.jsx
  - Vùng ảnh hưởng khi sửa: Biểu tượng tab trình duyệt trang quản trị Store Admin.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="omni-bg-admin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143d2c" />
      <stop offset="50%" stop-color="#205a3e" />
      <stop offset="100%" stop-color="#327c56" />
    </linearGradient>
    <linearGradient id="omni-accent-admin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="omni-glow-admin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0a2217" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#omni-bg-admin)" stroke="#4ea477" stroke-width="1.5" />
  <!-- Inner stylized 'o' ring -->
  <circle cx="21" cy="21" r="8" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <!-- Vibrant mint botanical dot -->
  <circle cx="31" cy="31" r="5" fill="url(#omni-accent-admin)" stroke="#ffffff" stroke-width="1.5" filter="url(#omni-glow-admin)" />
</svg>
