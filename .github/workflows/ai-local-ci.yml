name: store-admin-ci

on:
  push:
    branches:
      - feat/ai-local
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Verify runtime
        run: |
          node -e "if (process.versions.node !== '24.19.0') process.exit(1)"
          test "$(npm --version)" = "11.17.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend regression tests
        run: npm test

      - name: Validate catalog manifest
        run: node server-dotnet/scripts/validate-catalog-manifest.mjs

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Restore C# backend
        run: dotnet restore server-dotnet/server-dotnet.csproj

      - name: Build C# backend
        run: dotnet build server-dotnet/server-dotnet.csproj --no-restore --configuration Release

